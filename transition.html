<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>海屿寻踪——开启考古之旅</title>
    <link rel="stylesheet" href="css/global.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #1a1a1a;
        }

        /* 翻页舞台 */
        .stage {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            perspective: 2200px;
            perspective-origin: 50% 50%;
            background: #1a1a1a;
        }

        /* 背后页面：第一章导读页 */
        .back-page {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            background: #1a1a1a;
        }

        .back-page iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        /* 当前页面：转场视频作为书页 */
        .front-page {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            transform-origin: left center;
            transform-style: preserve-3d;
            backface-visibility: hidden;
            background: #000;
        }

        .front-page video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
            display: block;
        }

        /* 翻页阴影：增强纸张空间感 */
        .front-page::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(to right, rgba(0, 0, 0, 0.28), transparent 35%);
            opacity: 0;
            pointer-events: none;
        }

        .front-page.flipping {
            animation: pageFlip 1.8s cubic-bezier(0.45, 0, 0.25, 1) forwards;
        }

        .front-page.flipping::after {
            animation: pageShadow 1.8s cubic-bezier(0.45, 0, 0.25, 1) forwards;
        }

        @keyframes pageFlip {
            0% {
                transform: rotateY(0deg);
            }
            100% {
                transform: rotateY(-180deg);
            }
        }

        @keyframes pageShadow {
            0% {
                opacity: 0;
            }
            20% {
                opacity: 1;
            }
            80% {
                opacity: 1;
            }
            100% {
                opacity: 0;
            }
        }
    </style>
</head>
<body>
    <div class="stage" id="stage">
        <!-- 背后的第一章导读页 -->
        <div class="back-page" id="back-page">
            <iframe id="chapter-frame" src="chapter1.html?preload=1" frameborder="0" title="第一章导读页"></iframe>
        </div>

        <!-- 当前转场视频书页 -->
        <div class="front-page" id="front-page">
            <video id="transition-video" src="assets/videos/转场动画.mp4?v=2" autoplay muted playsinline></video>
        </div>
    </div>

    <script>
        (function () {
            const video = document.getElementById('transition-video');
            const frontPage = document.getElementById('front-page');
            const targetPage = 'chapter1.html';
            let hasFlipped = false;
            let pageFlipSoundPlayed = false;

            const pageFlipAudio = new Audio('assets/首页/翻页.mp3');
            pageFlipAudio.preload = 'auto';

            function playPageFlipSound() {
                if (pageFlipSoundPlayed) return;
                pageFlipSoundPlayed = true;
                pageFlipAudio.currentTime = 0;
                pageFlipAudio.play().catch(function () {});
            }

            function enterChapter() {
                window.location.replace(targetPage);
            }

            function startPageFlip() {
                if (hasFlipped) return;
                hasFlipped = true;

                // 将当前视频页面作为书页向左翻开
                frontPage.classList.add('flipping');

                // 翻页动画完成后进入第一章导读页
                setTimeout(enterChapter, 1800);
            }

            video.addEventListener('playing', function onPlaying() {
                video.removeEventListener('playing', onPlaying);
                setTimeout(playPageFlipSound, 1000);
            });

            video.addEventListener('ended', startPageFlip);

            // 容错：若视频因异常未能触发 ended，则在可播放后按其时长兜底触发
            video.addEventListener('loadedmetadata', function () {
                const duration = video.duration;
                if (duration && isFinite(duration)) {
                    setTimeout(startPageFlip, Math.ceil(duration * 1000) + 500);
                }
            });

            // 极端情况：视频加载失败也允许继续进入主体章节
            video.addEventListener('error', function () {
                setTimeout(startPageFlip, 1500);
            });
        })();
    </script>
    <script src="js/global-music.js"></script>
</body>
</html>
